<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Documents | Portfolio CMS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/editorial.css?v=20260731">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <link rel="stylesheet" href="../css/editor.css">
  <link rel="stylesheet" href="../css/pages.css?v=20260730">
</head>
<body>
  <header class="site-header" id="header">
    <a href="../index.html" class="brand">JANG BEOM JO</a>
    <nav class="nav-desktop" id="navDesktop"></nav>
    <div class="header-actions" id="headerActions"></div>
    <button class="nav-toggle" type="button" aria-label="메뉴" aria-expanded="false">
      <span></span><span></span>
    </button>
  </header>
  <nav class="nav-mobile" id="navMobile" aria-hidden="true"></nav>
  <script src="../js/cms/nav.js"></script>

  <main class="page-main">
    <div class="container">
      <div class="documents-page__head reveal">
        <span class="section-index">Documents</span>
        <p class="page-lead">증명서·포트폴리오 등 파일을 안전하게 관리합니다. 비공개 문서는 로그인한 관리자만 다운로드할 수 있습니다.</p>
        <div class="documents-legend reveal edit-only">
          <span class="doc-badge doc-badge--public">공개</span>
          <span class="doc-badge doc-badge--private">비공개</span>
          <span class="doc-badge doc-badge--link">링크 공유</span>
          <span class="doc-badge doc-badge--password">비밀번호</span>
        </div>
        <div class="documents-summary" id="documentsSummary"></div>

        <div class="page-action-hub edit-only" id="documentsActionHub">
          <div class="page-action-bar">
            <button type="button" class="page-action-btn page-action-btn--primary" id="docUploadBtn">↑ 파일 업로드</button>
            <button type="button" class="page-action-btn" id="docAddEmptyBtn">+ 빈 문서 추가</button>
          </div>
        </div>
      </div>
      <div class="doc-dropzone edit-only" id="docDropzone">
        <p>파일을 드래그 앤 드롭하거나 클릭하여 업로드</p>
        <small>PDF, PNG, JPG, DOCX, HWP, ZIP</small>
      </div>
      <div class="documents-grid reveal" id="documentsGrid"></div>
    </div>
  </main>

  <footer class="site-footer"><p>© Portfolio CMS</p></footer>
  <div class="editor-drawer" id="editorDrawer" aria-hidden="true"></div>

  <script src="../js/portfolio-data.js"></script>
  <script src="../js/data-loader.js"></script>
  <script src="../js/editor/store.js"></script>
  <script src="../js/editor/history.js"></script>
  <script src="../js/editor/autosave.js?v=20260723"></script>
  <script src="../js/editor/draft.js"></script>
  <script src="../js/cms/shared.js?v=20260730"></script>
  <script src="../js/cms/documents-access.js?v=20260730"></script>
  <script src="../js/cms/page-actions.js?v=20260723"></script>
  <script src="../js/editor/auth.js"></script>
  <script src="../js/editor/github.js"></script>
  <script src="../js/editor/upload.js"></script>
  <script src="../js/editor/ui.js"></script>
  <script src="../js/cms/github-panel.js"></script>
  <script src="../js/cms/header.js"></script>
  <script src="../js/seo.js"></script>
  <script src="../js/theme.js?v=20260731"></script>
  <script src="../js/editor/inline-editor.js?v=20260731"></script>
  <script src="../js/pages/documents.js?v=20260730"></script>
</body>
</html>
